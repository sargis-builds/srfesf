<!DOCTYPE html>
<html lang="hy">
<head>

<title>Երևանյան Առաքիչ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f0f1e;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff; user-select: none;
  }
  #game { width: 100vw; height: 100vh; display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }

  #topBar {
    top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 12px 26px; border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; gap: 28px;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #topBar .item { display: flex; align-items: center; gap: 8px; }
  #topBar .label { color: #888; font-weight: 400; }
  #topBar .value { color: #ffd166; font-weight: 800; font-size: 17px; }

  #mission {
    top: 84px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding: 14px 32px; border-radius: 32px;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(79,172,254,0.5);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center; letter-spacing: 0.3px;
    white-space: nowrap;
  }
  #mission.deliver {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    box-shadow: 0 10px 30px rgba(245,87,108,0.5);
  }

  #speedo {
    bottom: 28px; right: 28px;
    background: rgba(0,0,0,0.65);
    padding: 16px 26px; border-radius: 18px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #speedo .num {
    font-size: 38px; font-weight: 900;
    color: #ffd166; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #speedo .unit {
    font-size: 11px; color: #888;
    letter-spacing: 3px; margin-top: 4px;
  }

  #minimap {
  top: 16px; right: 16px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  border: 3px solid rgba(255,255,255,0.15);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 12;
}

@media (max-width: 600px) {
  #minimap {
    width: 110px; height: 110px;
    top: 12px; right: 12px;
  }
}
  #minimap canvas { width: 100%; height: 100%; display: block; }

  #controls {
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.55);
    padding: 12px 18px; border-radius: 14px;
    font-size: 12px; color: #aaa;
    line-height: 1.8;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #controls b { color: #ffd166; font-weight: 700; }

  #toast {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.9);
    padding: 24px 48px; border-radius: 24px;
    font-size: 28px; font-weight: 900;
    color: #ffd166;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 3px solid #ffd166;
    box-shadow: 0 20px 60px rgba(255,209,102,0.4);
    pointer-events: none;
  }
  #toast.show { transform: translate(-50%, -50%) scale(1); }

  /* ⚠️ ՆՈՐ — direction arrow */
  #directionArrow {
    position: fixed;
    top: 50%; left: 50%;
    font-size: 48px;
    color: #ffd166;
    text-shadow: 0 0 20px rgba(255,209,102,0.8);
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity 0.3s;
    font-weight: 900;
    will-change: transform;
  }

  /* ⚠️ ՆՈՐ — FPS counter (DEBUG-ի համար) */
  #fpsCounter {
    position: fixed;
    top: 16px; right: 16px;
    background: rgba(0,0,0,0.6);
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 20;
    pointer-events: none;
    display: none;
  }
  #fpsCounter.show { display: block; }

  #startScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.6s;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }
  #startScreen h1 {
    font-size: 56px; font-weight: 900;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ffd166, #ff6b35);

    letter-spacing: -1px;
  }

    color: #888; font-size: 18px;

  }

    background: linear-gradient(135deg, #ff6b35, #f7931e);

  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(0.98); }

/* ============================================================
   MOBILE JOYSTICK + TOUCH CAMERA
   ============================================================ */

/* ⚠️ Թաքցնում ենք ամեն ինչ, բացի խաղից */
body {
  overflow: hidden;
  position: fixed;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#game {
  touch-action: none;
}

/* Joystick — ձախ ներքև */
#joystickZone {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 140px;
  height: 140px;
  z-index: 15;
  pointer-events: auto;
  touch-action: none;
  display: none;
}

#joystickBase {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.35);
  border: 3px solid rgba(255, 255, 255, 0.25);
  position: relative;
  backdrop-filter: blur(4px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

#joystickKnob {
  position: absolute;
  top: 50%; left: 50%;
  width: 60px; height: 60px;
  margin-left: -30px;
  margin-top: -30px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffd166, #ff6b35);
  border: 3px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 4px 16px rgba(255, 107, 53, 0.6);
  transition: transform 0.05s;
  will-change: transform;
}

/* ⚠️ Touch area — ամբողջ էկրանը, բացի joystick-ից */
#touchLookZone {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  pointer-events: auto;
  touch-action: none;
  display: none;
  background: transparent;
  /* ⚠️ ԱՅՍ ՏՈՂԵՐԸ ԱՎԵԼԱՑՐՈՒ */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Ցույց տալ mobile սարքերում */
@media (hover: none) and (pointer: coarse) {
  #joystickZone { display: block; }
  #touchLookZone { display: block; }
  #controls { display: none; }
}

/* Desktop-ի համար joystick-ը թաքցնում ենք */
@media (hover: hover) and (pointer: fine) {
  #joystickZone { display: none; }
  #touchLookZone { display: none; }
}

/* Mobile-ում HUD-ը փոքրացնում ենք */
@media (max-width: 600px) {
  #topBar {
    font-size: 12px;
    padding: 8px 16px;
    gap: 16px;
  }
  #topBar .value { font-size: 14px; }

  #mission {
    font-size: 13px;
    padding: 10px 20px;
    top: 64px;
  }

  #speedo {
    bottom: 20px; right: 20px;
    padding: 10px 16px;
  }
  #speedo .num { font-size: 24px; }
  #speedo .unit { font-size: 9px; }

  #directionArrow {
    font-size: 36px;
  }
}

/* ============================================================
   FULLSCREEN MAP
   ============================================================ */

#fullscreenMap {
  position: fixed;
  top: 0;
  right: 0;
  width: 50vw;
  height: 100vh;
  background: rgba(15, 15, 30, 0.55);
  backdrop-filter: blur(2px);
  z-index: 200;
  display: none;
  overflow: hidden;
  cursor: grab;
  border-left: 2px solid rgba(255, 209, 102, 0.6);
}

#fullscreenMap.open {
  display: block;
}

#fullscreenMap.dragging {
  cursor: grabbing;
}

#fullscreenMap.open {
  display: block;
}

#fullscreenMap.open {
  display: block;
}

#fullscreenMap.dragging {
  cursor: grabbing;
}

#fullscreenMapCanvas {

}

#closeMapBtn {

  height: 50px;
  border-radius: 50%;
  background: rgba(255, 60, 60, 0.9);

  border: 3px solid #fff;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
  z-index: 201;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, background 0.15s;
}

#closeMapBtn:hover {
  background: rgba(255, 30, 30, 1);
  transform: scale(1.1);
}

#closeMapBtn:active {
  transform: scale(0.95);
}

/* Minimap-ը դառնում է clickable */
#minimap {
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}

#minimap:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 40px rgba(255, 209, 102, 0.5);
}

#streetsList {

/* ⚠️ ԸՆՏՐՎԱԾ ՓՈՂՈՑԻ ԻՆՖՈՐՄԱՑԻԱ */
#streetInfo {

#streetInfo h3 {

#streetInfoPoints {

/* Minimap-ը clickable */

<script type="module">

import * as THREE from 'three';

// ⚠️ DEBUG flag — FPS և console.log-երի համար
const DEBUG = false;

// ⚠️ Camera-ի լրացուցիչ պտույտ (touch look-ի համար)
let cameraYawOffset = 0;

let cameraPitchOffset = Math.PI / 85;   // 15° — սկզբնական

// === ՄԱՍ 2-ը կցվում է այստեղից ===

// === ՄԱՍ 2 — THREE.JS SETUP + LIGHTS + GROUND ===

// ========== RENDERER ==========
const canvas = document.getElementById('game');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ========== SCENE ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 400, 1500);

// ========== CAMERA (2.5D Isometric) ==========
const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  600
);

// Isometric offset — տեսախցիկը միշտ խաղացողից այս հեռավորության վրա
const CAM_OFFSET = new THREE.Vector3(34, 42, 34);
const CAM_LOOK_OFFSET = new THREE.Vector3(0, 0, -4);

// Սկզբնական դիրք
camera.position.copy(CAM_OFFSET);
camera.lookAt(0, 0, 0);

const CAM_DISTANCE = 13;
const CAM_HEIGHT = 11;
const CAM_LOOK_AHEAD = 7;
const CAM_SMOOTH_POS = 6.0;
const CAM_SMOOTH_LOOK = 8.0;
const SUN_OFFSET = new THREE.Vector3(60, 90, 40);

// ========== LIGHTS ==========
// Ambient / hemisphere — ընդհանուր լույս
const hemi = new THREE.HemisphereLight(0xffffff, 0x6688aa, 0.9);
scene.add(hemi);

// Արև — ուղղորդված լույս ստվերներով
const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -140;
sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140;
sun.shadow.camera.bottom = -140;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Արևի թիրախը (կթարմացվի խաղացողի հետ)
const sunTarget = new THREE.Object3D();
scene.add(sunTarget);
sun.target = sunTarget;

// ========== GROUND ==========
const groundGeo = new THREE.PlaneGeometry(600, 600);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x6ab04c,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ========== DECORATIVE GRASS PATCHES ==========
// Փոքր կանաչ բծեր՝ գետնին բազմազանություն տալու համար
const grassMat = new THREE.MeshStandardMaterial({
  color: 0x7bc95f,
  roughness: 1
});
for (let i = 0; i < 60; i++) {
  const patch = new THREE.Mesh(
    new THREE.CircleGeometry(1 + Math.random() * 2, 8),
    grassMat
  );
  patch.rotation.x = -Math.PI / 2;
  patch.position.set(
    (Math.random() - 0.5) * 300,
    0.01,
    (Math.random() - 0.5) * 300
  );
  scene.add(patch);
}

/* ============================================================
   ՄԱՍ 3B — ՓՈՂՈՑՆԵՐԻ ԳԾՈՒՄ (CatmullRomCurve3)
   ============================================================ */

// ========== MATERIALS ==========
const avenueMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2a, roughness: 0.9
});
const streetMat = new THREE.MeshStandardMaterial({
  color: 0x3a3a3a, roughness: 0.95
});
const sidewalkMat = new THREE.MeshStandardMaterial({
  color: 0xc4a484, roughness: 0.85
});
const curbMat = new THREE.MeshStandardMaterial({
  color: 0x8a6a4a, roughness: 0.8
});
const dashMat = new THREE.MeshStandardMaterial({
  color: 0xffdd55, emissive: 0x443300, emissiveIntensity: 0.4
});
const crosswalkMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.8
});

// ========== COLLISION ARRAYS ==========
const roadMeshes = [];      // ամեն ճանապարհի mesh (collision-ի համար)
const sidewalks = [];       // մայթերի collider-ներ (հետագա)
const roadCurves = [];      // ամեն փողոցի curve + width

// ========== CONSTANTS ==========
const CURVE_SEGMENTS = 40;       // Քանի՞ ուղիղ հատված ամեն կորի համար
const SIDEWALK_WIDTH = 2;         // Մայթի լայնությունը (մետր)
const SIDEWALK_HEIGHT = 0.3;      // Մայթի բարձրությունը
const ROAD_Y = 0.05;              // Ճանապարհի y-ը

// ============================================================
// ԳԾՈՒՄ ԵՆՔ ՓՈՂՈՑՆԵՐԸ
// ============================================================

STREETS.forEach(street => {
  // 1. Կետերը → Vector3
  const points3D = street.points.map(p => new THREE.Vector3(p.x, 0, p.z));

  // 2. Ստեղծում ենք CatmullRomCurve3
  // ⚠️ closed = false, որովհետև փողոցները բաց են
  const curve = new THREE.CatmullRomCurve3(points3D, false, 'catmullrom', 0.5);

  // 3. Վերցնում ենք 40 կետ կորի վրա
  const curvePoints = curve.getPoints(CURVE_SEGMENTS);

  // 4. Ամեն 2 հարակից կետի միջև ստեղծում ենք ուղիղ հատված (road segment)
  const roadMat = street.type === 'avenue' ? avenueMat : streetMat;
  const roadWidth = street.width;

  for (let i = 0; i < curvePoints.length - 1; i++) {
    const p1 = curvePoints[i];
    const p2 = curvePoints[i + 1];

    // Հատվածի երկարությունը
    const dx = p2.x - p1.x;
    const dz = p2.z - p1.z;
    const segmentLength = Math.sqrt(dx * dx + dz * dz);

    if (segmentLength < 0.01) continue;  // Շատ կարճ հատվածները բաց ենք թողնում

    // Անկյունը (heading) այս հատվածի համար
    const heading = Math.atan2(dx, dz);

    // Հատվածի կենտրոնը
    const cx = (p1.x + p2.x) / 2;
    const cz = (p1.z + p2.z) / 2;

    // Ստեղծում ենք road segment (ուղղանկյուն)
    const segment = new THREE.Mesh(
      new THREE.BoxGeometry(roadWidth, 0.1, segmentLength),
      roadMat
    );
    segment.position.set(cx, ROAD_Y, cz);
    segment.rotation.y = heading;
    segment.receiveShadow = true;
    scene.add(segment);

    // Պահում ենք collision-ի համար
    roadMeshes.push({
      x: cx,
      z: cz,
      heading: heading,
      length: segmentLength,
      width: roadWidth,
      // AABB մոտավորություն (հետագա collision-ի համար)
      minX: Math.min(p1.x, p2.x) - roadWidth / 2,
      maxX: Math.max(p1.x, p2.x) + roadWidth / 2,
      minZ: Math.min(p1.z, p2.z) - roadWidth / 2,
      maxZ: Math.max(p1.z, p2.z) + roadWidth / 2
    });
  }

  // 5. Պահում ենք curve-ը (հետագա sidewalks-ի համար)
  roadCurves.push({
    name: street.name,
    curve: curve,
    points: curvePoints,
    width: street.width,
    type: street.type
  });

  // ============================================================
  // 6. ԿԵՆՏՐՈՆԱԿԱՆ ԳԾԵՐ (dashed line) — միայն avenue-ի և main-ի
  // ============================================================
  if (street.type === 'avenue' || street.type === 'main') {
    for (let i = 0; i < curvePoints.length - 1; i += 4) {
      // Ամեն 4-րդ կետից մեկ dashed line
      const p1 = curvePoints[i];
      const p2 = curvePoints[Math.min(i + 1, curvePoints.length - 1)];

      const dx = p2.x - p1.x;
      const dz = p2.z - p1.z;
      const len = Math.sqrt(dx * dx + dz * dz);
      if (len < 0.01) continue;

      const heading = Math.atan2(dx, dz);
      const cx = (p1.x + p2.x) / 2;
      const cz = (p1.z + p2.z) / 2;

      const dash = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.12, len * 0.6),
        dashMat
      );
      dash.position.set(cx, ROAD_Y + 0.05, cz);
      dash.rotation.y = heading;
      scene.add(dash);
    }
  }
});

// 7. ՀՐԱՊԱՐԱԿԻ ՀՐԱՊԱՐԱԿԱԳՐԱԿԱՆ ՄԱԿԵՐԵՍ
// ============================================================
// Կլոր սալիկ Հանրապետության հրապարակի կենտրոնում

// ============================================================
console.log(`✅ 3B: Գծվեց ${roadMeshes.length} ճանապարհի հատված`);
console.log(`✅ 3B: ${roadCurves.length} փողոց`);

/* ============================================================
   ՄԱՍ 3C — SIDEWALKS + CROSSWALKS + STREET LIGHTS (ՈՒՂՂՎԱԾ)
   ============================================================ */

// ============================================================
// 1. SIDEWALKS — մայթեր ամեն փողոցի 2 կողմից
// ============================================================
roadCurves.forEach(street => {
  const halfWidth = street.width / 2;
  const points = street.points;

  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];

    const dx = p2.x - p1.x;
    const dz = p2.z - p1.z;
    const segLen = Math.sqrt(dx * dx + dz * dz);
    if (segLen < 0.01) continue;

    const heading = Math.atan2(dx, dz);

    const cx = (p1.x + p2.x) / 2;
    const cz = (p1.z + p2.z) / 2;

    const perpX = Math.cos(heading);
    const perpZ = -Math.sin(heading);

    const rightX = cx + perpX * (halfWidth + SIDEWALK_WIDTH / 2);
    const rightZ = cz + perpZ * (halfWidth + SIDEWALK_WIDTH / 2);

    const leftX = cx - perpX * (halfWidth + SIDEWALK_WIDTH / 2);
    const leftZ = cz - perpZ * (halfWidth + SIDEWALK_WIDTH / 2);

    // Աջ մայթ
    const rightSidewalk = new THREE.Mesh(
      new THREE.BoxGeometry(SIDEWALK_WIDTH, SIDEWALK_HEIGHT, segLen),
      sidewalkMat
    );
    rightSidewalk.position.set(rightX, SIDEWALK_HEIGHT / 2, rightZ);
    rightSidewalk.rotation.y = heading;
    rightSidewalk.receiveShadow = true;
    rightSidewalk.castShadow = true;
    scene.add(rightSidewalk);

    // Ձախ մայթ
    const leftSidewalk = new THREE.Mesh(
      new THREE.BoxGeometry(SIDEWALK_WIDTH, SIDEWALK_HEIGHT, segLen),
      sidewalkMat
    );
    leftSidewalk.position.set(leftX, SIDEWALK_HEIGHT / 2, leftZ);
    leftSidewalk.rotation.y = heading;
    leftSidewalk.receiveShadow = true;
    leftSidewalk.castShadow = true;
    scene.add(leftSidewalk);

    // Collision-ի տվյալներ
    sidewalks.push({
      x: rightX, z: rightZ, heading,
      w: SIDEWALK_WIDTH, d: segLen
    });
    sidewalks.push({
      x: leftX, z: leftZ, heading,
      w: SIDEWALK_WIDTH, d: segLen
    });

    // Curb — աջ
    const rightCurb = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.35, segLen),
      curbMat
    );
    rightCurb.position.set(
      cx + perpX * halfWidth,
      0.175,
      cz + perpZ * halfWidth
    );
    rightCurb.rotation.y = heading;
    rightCurb.castShadow = true;
    scene.add(rightCurb);

    // Curb — ձախ
    const leftCurb = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.35, segLen),
      curbMat
    );
    leftCurb.position.set(
      cx - perpX * halfWidth,
      0.175,
      cz - perpZ * halfWidth
    );
    leftCurb.rotation.y = heading;
    leftCurb.castShadow = true;
    scene.add(leftCurb);
  }
});

// ============================================================
// 2. INTERSECTIONS — խաչմերուկների հայտնաբերում
// ============================================================
const intersections = [];

for (let i = 0; i < roadCurves.length; i++) {
  for (let j = i + 1; j < roadCurves.length; j++) {
    const curveA = roadCurves[i];
    const curveB = roadCurves[j];

    for (let a = 0; a < curveA.points.length - 1; a++) {
      const p1 = curveA.points[a];
      const p2 = curveA.points[a + 1];

      for (let b = 0; b < curveB.points.length - 1; b++) {
        const p3 = curveB.points[b];
        const p4 = curveB.points[b + 1];

        const intersection = lineIntersection(p1, p2, p3, p4);
        if (intersection) {
          const t1 = intersection.t1;
          const t2 = intersection.t2;
          if (t1 > 0.1 && t1 < 0.9 && t2 > 0.1 && t2 < 0.9) {
            intersections.push({
              x: intersection.x,
              z: intersection.z,
              curveA: curveA,
              curveB: curveB,
              width: Math.max(curveA.width, curveB.width)
            });
          }
        }
      }
    }
  }
}

// ============================================================
// 3. LINE INTERSECTION
// ============================================================
function lineIntersection(p1, p2, p3, p4) {
  const d1x = p2.x - p1.x;
  const d1z = p2.z - p1.z;
  const d2x = p4.x - p3.x;
  const d2z = p4.z - p3.z;

  const denom = d1x * d2z - d1z * d2x;
  if (Math.abs(denom) < 0.001) return null;

  const t1 = ((p3.x - p1.x) * d2z - (p3.z - p1.z) * d2x) / denom;
  const t2 = ((p3.x - p1.x) * d1z - (p3.z - p1.z) * d1x) / denom;

  if (t1 < 0 || t1 > 1 || t2 < 0 || t2 > 1) return null;

  return {
    x: p1.x + t1 * d1x,
    z: p1.z + t1 * d1z,
    t1, t2
  };
}

// ============================================================
// 4. CROSSWALKS — zebra-ներ խաչմերուկներում
// ============================================================
intersections.forEach(inter => {
  const zebraCount = 4;
  const zebraWidth = 0.8;
  const zebraGap = 0.6;

  const directions = [

// ========== BUILDING COLORS ==========
const buildingColors = [
  0xd4a373, 0xccd5ae, 0xe9edc9, 0xfaedcd,
  0xb08968, 0xa68a6d, 0xc9ada7, 0xe8d5b7,
  0xd9bfa3, 0xc4a484, 0xbfa980, 0xe6d5b8,
  0x8b6b4a, 0xa88868, 0x9b7a5a
];

const roofColors = [0x8b5a3c, 0x6b4423, 0x7a5c3f, 0x5c4033];

// ========== COLLISION ARRAYS ==========
const buildings = [];
const landmarks = [];

// ========== BUILDING FACTORY ==========
// Նույն ֆունկցիան, ինչ հին կոդում, բայց հարմարեցված մեծ չափերի համար
function addBuilding(x, z, w, d, h) {
  if (!isFinite(x) || !isFinite(z) || !isFinite(w) || !isFinite(d) || !isFinite(h)) {
    return;
  }
  if (w <= 0 || d <= 0 || h <= 0) return;

  const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
  const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];

  // --- Main body ---
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
  );
  body.position.set(x, h / 2, z);
  body.castShadow = true;
  body.receiveShadow = true;
  scene.add(body);

  // --- Roof ---
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 1, 1, d + 1),
    new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.85 })
  );
  roof.position.set(x, h + 0.5, z);
  roof.castShadow = true;
  scene.add(roof);

  // --- Windows (միայն 10մ-ից բարձր շենքերի) ---
  if (h > 10) {
    const winMat = new THREE.MeshStandardMaterial({
      color: 0x88ccff,
      emissive: 0x224466,
      emissiveIntensity: 0.5,
      roughness: 0.2,
      metalness: 0.3
    });

    const winW = 2;
    const winH = 2.5;
    const winGapX = 5;
    const winGapY = 5;
    const rows = Math.max(0, Math.floor((h - 3) / winGapY));
    const colsX = Math.max(0, Math.floor((w - 3) / winGapX));
    const colsZ = Math.max(0, Math.floor((d - 3) / winGapX));

    // Առջև և հետև
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < colsX; c++) {
        const wx = x - w / 2 + 3 + c * winGapX;
        const wy = 4 + r * winGapY;

        const winF = new THREE.Mesh(
          new THREE.BoxGeometry(winW, winH, 0.2),
          winMat
        );
        winF.position.set(wx, wy, z + d / 2 + 0.1);
        scene.add(winF);

        const winB = new THREE.Mesh(
          new THREE.BoxGeometry(winW, winH, 0.2),
          winMat
        );
        winB.position.set(wx, wy, z - d / 2 - 0.1);
        scene.add(winB);
      }
    }

    // Ձախ և աջ
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < colsZ; c++) {
        const wz = z - d / 2 + 3 + c * winGapX;
        const wy = 4 + r * winGapY;

        const winL = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, winH, winW),
          winMat
        );
        winL.position.set(x - w / 2 - 0.1, wy, wz);
        scene.add(winL);

        const winR = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, winH, winW),
          winMat
        );
        winR.position.set(x + w / 2 + 0.1, wy, wz);
        scene.add(winR);
      }
    }
  }

  // --- Collision data ---
  buildings.push({
    minX: x - w / 2,
    maxX: x + w / 2,
    minZ: z - d / 2,
    maxZ: z + d / 2
  });
}

    e.code === 'ArrowUp' ||
    e.code === 'ArrowDown' ||
    e.code === 'ArrowLeft' ||
    e.code === 'ArrowRight'
  ) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// ⚠️ Մաքրում ենք ստեղները, երբ պատուհանը կորցնում է focus-ը
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    for (const k in keys) keys[k] = false;
  }
});

// ============================================================
// COLLISION CHECK
// ============================================================

function checkCollision(x, z, radius = 1.15) {
  // Շենքեր
  for (const b of buildings) {
    const closestX = Math.max(b.minX, Math.min(x, b.maxX));
    const closestZ = Math.max(b.minZ, Math.min(z, b.maxZ));
    const dx = x - closestX;
    const dz = z - closestZ;
    if ((dx * dx + dz * dz) < radius * radius) return true;
  }

  // ⚠️ Landmark-ներ (Cascade, Opera, Matenadaran)
  for (const b of landmarks) {
    const closestX = Math.max(b.minX, Math.min(x, b.maxX));
    const closestZ = Math.max(b.minZ, Math.min(z, b.maxZ));
    const dx = x - closestX;
    const dz = z - closestZ;
    if ((dx * dx + dz * dz) < radius * radius) return true;
  }

  return false;
}

// ============================================================
// PHYSICS
// ============================================================

function updatePhysics(dt) {
  // ---------- INPUT ----------
  const accelerating = keys['KeyW'] || keys['ArrowUp'];
  const braking = keys['KeyS'] || keys['ArrowDown'];
  const steeringLeft = keys['KeyA'] || keys['ArrowLeft'];
  const steeringRight = keys['KeyD'] || keys['ArrowRight'];
  const handbrake = keys['Space'];

  // ---------- ACCELERATION ----------
  if (accelerating) {
    playerState.speed += playerState.acceleration * dt;
  } else if (braking) {
    if (playerState.speed > 0) {
      playerState.speed -= playerState.brakeForce * dt;
    } else {
      playerState.speed -= playerState.acceleration * 0.55 * dt;
    }
  } else {
    if (playerState.speed > 0) {
      playerState.speed -= playerState.friction * dt;
      if (playerState.speed < 0) playerState.speed = 0;
    } else if (playerState.speed < 0) {
      playerState.speed += playerState.friction * dt;
      if (playerState.speed > 0) playerState.speed = 0;
    }
  }

  playerState.speed = THREE.MathUtils.clamp(
    playerState.speed,
    -playerState.reverseSpeed,
    playerState.maxSpeed
  );

  // ---------- TURNING (ԻՆԵՐՑԻԱՅՈՎ) ----------
  //
  // ⚠️ ՈՒՂՂՎԱԾ ՆՇԱՆԸ.
  // A (ձախ) → turnInput = +1 → heading-ը աճում է → մեքենան +X ուղղությամբ
  //    Երբ հետևից ենք նայում (+Z-ից -Z), +X-ը ձախ է ✅
  // D (աջ)  → turnInput = -1 → heading-ը նվազում է → մեքենան -X ուղղությամբ
  //    -X-ը աջ է ✅
  let turnInput = 0;
  if (steeringLeft) turnInput += 1;
  if (steeringRight) turnInput -= 1;

  const speedAbs = Math.abs(playerState.speed);
  const canTurn = speedAbs > 0.15;

  if (canTurn && turnInput !== 0) {
    // Արագության ազդեցությունը շրջադարձի վրա
    const speedFactor = THREE.MathUtils.clamp(
      speedAbs / playerState.maxSpeed,
      0.35,
      1.0
    );

    // Ցանկալի angular velocity
    const targetAngularVel =
      turnInput * playerState.turnSpeed * speedFactor;

    // Հետընթացի ժամանակ ուղղությունը հակառակ է
    const sign = playerState.speed < 0 ? -1 : 1;

    // Սահուն արագացում դեպի ցանկալի արժեքը (իներցիա)
    playerState.angularVelocity = THREE.MathUtils.lerp(
      playerState.angularVelocity,
      targetAngularVel * sign,
      playerState.angularAccel * dt
    );
  } else {
    // Երբ չենք սեղմում — սահուն մարում է
    playerState.angularVelocity = THREE.MathUtils.lerp(
      playerState.angularVelocity,
      0,
      playerState.angularDamping * dt
    );
  }

  // Սահմանափակում
  playerState.angularVelocity = THREE.MathUtils.clamp(
    playerState.angularVelocity,
    -playerState.maxAngularVelocity,
    playerState.maxAngularVelocity
  );

  // Կիրառում heading-ին
  playerState.heading += playerState.angularVelocity * dt;

  // ---------- HANDBRAKE ----------
  if (handbrake) {
    playerState.speed *= Math.pow(0.04, dt);
    playerState.drift = THREE.MathUtils.lerp(playerState.drift, 1, 8 * dt);
  } else {
    playerState.drift = THREE.MathUtils.lerp(playerState.drift, 0, 6 * dt);
  }

  // ---------- MOVEMENT ----------
  const distance = playerState.speed * dt;
  const forwardX = Math.sin(playerState.heading);
  const forwardZ = Math.cos(playerState.heading);

  const newX = player.position.x + forwardX * distance;
  const newZ = player.position.z + forwardZ * distance;

  // ---------- COLLISION + WALL SLIDING ----------
  if (!checkCollision(newX, newZ)) {
    // Ազատ ճանապարհ
    player.position.x = newX;
    player.position.z = newZ;
  } else {
    // Փորձենք միայն X-ով
    const tryX = player.position.x + forwardX * distance;
    const tryZ = player.position.z;

    // Փորձենք միայն Z-ով
    const tryX2 = player.position.x;
    const tryZ2 = player.position.z + forwardZ * distance;

    if (!checkCollision(tryX, tryZ)) {
      // Սահում ենք պատի երկայնքով (X-ով)
      player.position.x = tryX;
      playerState.speed *= 0.6;
    } else if (!checkCollision(tryX2, tryZ2)) {
      // Սահում ենք պատի երկայնքով (Z-ով)
      player.position.z = tryZ2;
      playerState.speed *= 0.6;
    } else {
      // Ամբողջովին արգելափակված
      playerState.speed *= -0.15;
    }
  }

  // ---------- PLAYER ROTATION ----------
  player.rotation.y = playerState.heading;

  // ---------- WHEEL ROTATION ----------
  // ⚠️ ՈՒՂՂՎԱԾ. Անիվները դրված են rotation.z = π/2-ով (կողքի վրա),
  // դրա համար գլորվելու համար պետք է պտտել rotation.y-ով։
  const wheelRotation = playerState.speed * dt * 2.5;
  wheels.forEach(wheel => {
    wheel.rotation.x += wheelRotation;
  });

  // ---------- SUN FOLLOW PLAYER ----------
  sunTarget.position.copy(player.position);
  sun.position.copy(player.position).add(SUN_OFFSET);
}

// ============================================================
// CHASE CAMERA (ՄԻՇՏ ՀԵՏԵՎԻՑ)
// ============================================================

const camLookAt = new THREE.Vector3();
const camDesiredPos = new THREE.Vector3();
const camDesiredLook = new THREE.Vector3();
let camInitialized = false;

function updateCamera(dt) {
  const h = playerState.heading + cameraYawOffset;
  const forwardX = Math.sin(h);
  const forwardZ = Math.cos(h);

  // ⚠️ Pitch — ուղղահայաց պտույտ
  const heightOffset = Math.sin(cameraPitchOffset) * CAM_DISTANCE;
  const distanceScale = Math.cos(cameraPitchOffset);

  camDesiredPos.set(
    player.position.x - forwardX * CAM_DISTANCE * distanceScale,
    player.position.y + CAM_HEIGHT + heightOffset,
    player.position.z - forwardZ * CAM_DISTANCE * distanceScale
  );

  camDesiredLook.set(
    player.position.x + forwardX * CAM_LOOK_AHEAD,
    player.position.y + 0.0,
    player.position.z + forwardZ * CAM_LOOK_AHEAD
  );

  const posLerp = 1 - Math.exp(-CAM_SMOOTH_POS * dt);
  const lookLerp = 1 - Math.exp(-CAM_SMOOTH_LOOK * dt);

  camera.position.lerp(camDesiredPos, posLerp);

  if (!camInitialized) {
    camLookAt.copy(camDesiredLook);
    camInitialized = true;
  } else {
    camLookAt.lerp(camDesiredLook, lookLerp);
  }
  camera.lookAt(camLookAt);
}

// SPEED DISPLAY (DOM throttle)

const speedNumEl = document.getElementById('speedNum');
let lastSpeedKmh = -1;

function updateSpeedDisplay() {

   ՄԱՍ 7 — DELIVERY MISSION SYSTEM (ՎԵՐՋՆԱԿԱՆ)

// ========== MISSION STATE ==========
const missionState = {
  phase: 'pickup',        // 'pickup' | 'deliver'
  pickupPoint: null,      // { x, z }
  deliverPoint: null,     // { x, z }
  pickupMarker: null,     // Three.js mesh
  deliverMarker: null,    // Three.js mesh
  pickupRadius: 4.0,      // ⚠️ 3.5 → 4.0
  deliverRadius: 4.0,
  locked: false           // ⚠️ ՆՈՐ — կրկնակի completeDelivery-ից խուսափելու համար
};

// ========== GAME STATE ==========
const gameState = {
  score: 0,
  delivered: 0,
  startTime: Date.now(),
  running: false
};

// ========== MARKER FACTORY ==========
function createMarker(color) {
  const group = new THREE.Group();

  // Հիմքի շրջան
  const ringGeo = new THREE.RingGeometry(2.5, 3.2, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.8
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.15;
  group.add(ring);

  // Ներքին շրջան
  const discGeo = new THREE.CircleGeometry(2.5, 32);
  const discMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.25,
    side: THREE.DoubleSide
  });
  const disc = new THREE.Mesh(discGeo, discMat);
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 0.12;
  group.add(disc);

  // Ուղղահայաց ճառագայթ
  const beamGeo = new THREE.CylinderGeometry(0.4, 0.4, 12, 12, 1, true);
  const beamMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.35,
    side: THREE.DoubleSide
  });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.position.y = 6;
  group.add(beam);

  // Իկոն
  const iconGeo = new THREE.SphereGeometry(0.7, 16, 16);
  const iconMat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.6
  });
  const iconMesh = new THREE.Mesh(iconGeo, iconMat);
  iconMesh.position.y = 3;
  group.add(iconMesh);

  group.userData.ring = ring;
  group.userData.beam = beam;
  group.userData.icon = iconMesh;

  return group;
}

// ========== RANDOM POSITION IN STREETS ==========
// ⚠️ Օգտագործում ենք ավելի մեծ radius, որ մարկերը չհայտնվի
// շենքի պատին կպած
function getRandomStreetPosition(excludePoint = null) {
  const attempts = 80;
  const SAFE_RADIUS = 4.5;

  for (let i = 0; i < attempts; i++) {
    const street = STREETS[Math.floor(Math.random() * STREETS.length)];
    const isHorizontal = (street.x2 - street.x1) > (street.z2 - street.z1);

    let x, z;
    if (isHorizontal) {
      x = street.x1 + Math.random() * (street.x2 - street.x1);
      z = (street.z1 + street.z2) / 2;
    } else {
      x = (street.x1 + street.x2) / 2;
      z = street.z1 + Math.random() * (street.z2 - street.z1);
    }

    // Հեռավորությունը խաղացողից (առնվազն 20մ)
    const dx = x - player.position.x;
    const dz = z - player.position.z;
    const distSq = dx * dx + dz * dz;
    if (distSq < 400) continue;

    // ⚠️ Հեռավորությունը excludePoint-ից (առնվազն 20մ)
    if (excludePoint) {
      const ex = x - excludePoint.x;
      const ez = z - excludePoint.z;
      if ((ex * ex + ez * ez) < 400) continue;
    }

    // ⚠️ Ստուգում ենք ավելի մեծ radius-ով, որ մարկերը չհպվի շենքին
    if (checkCollision(x, z, SAFE_RADIUS)) continue;

    return { x, z };
  }

  // Fallback
  return { x: 0, z: 20 };
}

// ========== START NEW MISSION ==========
function startNewMission() {
  // Մաքրում ենք հին ցուցիչները
  if (missionState.pickupMarker) {
    scene.remove(missionState.pickupMarker);
    missionState.pickupMarker = null;
  }
  if (missionState.deliverMarker) {
    scene.remove(missionState.deliverMarker);
    missionState.deliverMarker = null;
  }

  // Նոր կետեր
  missionState.pickupPoint = getRandomStreetPosition();
  missionState.deliverPoint = getRandomStreetPosition(missionState.pickupPoint);

  // Ստեղծում ենք ցուցիչները
  missionState.pickupMarker = createMarker(0x4facfe);
  missionState.pickupMarker.position.set(
    missionState.pickupPoint.x,
    0,
    missionState.pickupPoint.z
  );
  scene.add(missionState.pickupMarker);

  missionState.deliverMarker = createMarker(0xf5576c);
  missionState.deliverMarker.position.set(
    missionState.deliverPoint.x,
    0,
    missionState.deliverPoint.z
  );
  // Սկզբում թաքցնում ենք deliver-ը
  missionState.deliverMarker.visible = false;
  scene.add(missionState.deliverMarker);

  // Փուլը՝ pickup
  missionState.phase = 'pickup';
  missionState.locked = false;  // ⚠️ ապակողպում ենք նոր առաքելության համար

  updateMissionUI();
}

// ========== MISSION UI ==========
const missionEl = document.getElementById('mission');

function updateMissionUI() {
  if (missionState.phase === 'pickup') {
    missionEl.textContent = '📍 Գնա՛ պատվերի կետ';
    missionEl.classList.remove('deliver');
  } else {
    missionEl.textContent = '📦 Հասցրու՛ հաճախորդին';
    missionEl.classList.add('deliver');
  }
}

// ========== CHECK MISSION PROGRESS ==========
function checkMissionProgress() {
  // ⚠️ ԿՐԻՏԻԿԱԿԱՆ. Եթե արդեն ավարտված է, չկրկնենք
  if (missionState.locked) return;

  if (missionState.phase === 'pickup' && missionState.pickupPoint) {
    const dx = player.position.x - missionState.pickupPoint.x;
    const dz = player.position.z - missionState.pickupPoint.z;
    const distSq = dx * dx + dz * dz;

    if (distSq < missionState.pickupRadius * missionState.pickupRadius) {
      // Վերցրինք պատվերը
      missionState.phase = 'deliver';
      missionState.pickupMarker.visible = false;
      missionState.deliverMarker.visible = true;
      updateMissionUI();
      showToast('📦 Պատվերը վերցվեց!');
    }
  } else if (missionState.phase === 'deliver' && missionState.deliverPoint) {
    const dx = player.position.x - missionState.deliverPoint.x;
    const dz = player.position.z - missionState.deliverPoint.z;
    const distSq = dx * dx + dz * dz;

    if (distSq < missionState.deliverRadius * missionState.deliverRadius) {
      // Առաքվեց
      completeDelivery();
    }
  }
}

// ========== COMPLETE DELIVERY ==========
function completeDelivery() {
  // ⚠️ Կրկնակի կանչից պաշտպանություն
  if (missionState.locked) return;
  missionState.locked = true;

  gameState.score += 10;
  gameState.delivered += 1;

  document.getElementById('score').textContent = gameState.score;
  document.getElementById('delivered').textContent = gameState.delivered;

  showToast('+10 💰 Առաքվա՛ծ');

  // Նոր առաքելություն 800ms հետո
  setTimeout(() => {
    startNewMission();
  }, 800);
}

// ========== TOAST ==========
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
  }, 1200);
}

// ========== MARKER ANIMATION ==========
function animateMarkers(time) {
  const markers = [missionState.pickupMarker, missionState.deliverMarker];
  markers.forEach(m => {
    if (!m || !m.visible) return;

    // Պտտվող օղակ
    if (m.userData.ring) {
      m.userData.ring.rotation.z = time * 0.001;
    }

    // Վերև-ներքև շարժվող իկոն
    if (m.userData.icon) {
      m.userData.icon.position.y = 3 + Math.sin(time * 0.003) * 0.5;
    }

    // Թափանցիկության փոփոխություն
    if (m.userData.beam) {
      m.userData.beam.material.opacity = 0.25 + Math.sin(time * 0.002) * 0.15;
    }
  });
}

// ========== TIMER UPDATE (DOM THROTTLE) ==========
const timerEl = document.getElementById('timer');
let lastTimerText = '';

function updateTimer() {
  const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
  const minutes = Math.floor(elapsed / 60);
  const seconds = elapsed % 60;
  const text = `${minutes}:${seconds.toString().padStart(2, '0')}`;

  // ⚠️ Միայն թարմացնում ենք DOM-ը, երբ տեքստը փոխվում է
  if (text !== lastTimerText) {
    timerEl.textContent = text;
    lastTimerText = text;
  }
}

/* ============================================================
   ՄԱՍ 8 — MINIMAP + HUD + DIRECTION ARROW (ՎԵՐՋՆԱԿԱՆ)
   ============================================================ */

// ============================================================
// MINIMAP SETUP
// ============================================================

const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

const MINIMAP_SIZE = 200;
const MINIMAP_RADIUS = MINIMAP_SIZE / 2;

// ⚠️ ՈՒՂՂՎԱԾ. 0.9-ը չափազանց մեծ էր, մարկերները դուրս էին ընկնում
const MINIMAP_SCALE = 0.42;

// ============================================================
// DRAW MINIMAP
// ============================================================

function drawMinimap() {
  const ctx = minimapCtx;
  const cx = MINIMAP_RADIUS;
  const cy = MINIMAP_RADIUS;

  // Clear
  ctx.clearRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

  // ⚠️ ՄԻԱՅՆ ՄԵԿ save/restore ամբողջ գծելու համար
  ctx.save();

  // Clip շրջանակ
  ctx.beginPath();
  ctx.arc(cx, cy, MINIMAP_RADIUS - 2, 0, Math.PI * 2);
  ctx.clip();

  // Ֆոն
  ctx.fillStyle = '#2a3a2a';
  ctx.fillRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

  // World → Minimap coordinate helper
  const px = player.position.x;
  const pz = player.position.z;

  function worldToMap(wx, wz) {
    return {
      x: cx + (wx - px) * MINIMAP_SCALE,
      y: cy + (wz - pz) * MINIMAP_SCALE
    };
  }

  // --- Streets ---
  ctx.strokeStyle = '#555555';
  ctx.lineWidth = 4;
  STREETS.forEach(s => {
    const p1 = worldToMap(s.x1, s.z1);
    const p2 = worldToMap(s.x2, s.z2);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  });

  // --- Buildings ---
  ctx.fillStyle = '#8a7a5a';
  buildings.forEach(b => {
    const p1 = worldToMap(b.minX, b.minZ);
    const p2 = worldToMap(b.maxX, b.maxZ);
    ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
  });

  // --- Landmarks ---
  ctx.fillStyle = '#a89878';
  landmarks.forEach(b => {
    const p1 = worldToMap(b.minX, b.minZ);
    const p2 = worldToMap(b.maxX, b.maxZ);
    ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
  });

  // --- Mission markers ---
  if (missionState.phase === 'pickup' && missionState.pickupPoint) {
    const p = worldToMap(missionState.pickupPoint.x, missionState.pickupPoint.z);
    drawMarkerDot(ctx, p.x, p.y, '#4facfe', 6);
  }
  if (missionState.phase === 'deliver' && missionState.deliverPoint) {
    const p = worldToMap(missionState.deliverPoint.x, missionState.deliverPoint.z);
    drawMarkerDot(ctx, p.x, p.y, '#f5576c', 6);
  }

  // --- Player arrow (minimap-ի կենտրոնում) ---
  //
  // ⚠️ ՈՒՂՂՎԱԾ ՍԼԱՔԻ ԲԱՆԱՁԵՎԸ.
  //
  // Սլաքը նկարվում է (0,-8) գլխով → ուղղված է վերև (-Y)։
  // Canvas-ի rotate(θ) պտտում է ԺԱՄԱՑՈՒՅՑԻ ՈՒՂՂՈՒԹՅԱՄԲ։
  //
  // heading = 0 → forward = +Z → minimap-ում ներքև → rotate(π)
  // heading = π/2 → forward = +X → minimap-ում աջ → rotate(π/2)
  // heading = π → forward = -Z → minimap-ում վերև → rotate(0)
  // heading = -π/2 → forward = -X → minimap-ում ձախ → rotate(-π/2)
  //
  // Բանաձև. rotate = π - heading ✅
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI - playerState.heading);

  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(-6, 6);
  ctx.lineTo(0, 3);
  ctx.lineTo(6, 6);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();

  // --- North indicator (ՆԵՐՍԸ clip-ի) ---
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, 14);

  // ⚠️ ՄԻԱՅՆ ՄԵԿ restore ամբողջ ֆունկցիայի համար
  ctx.restore();

  // --- Border ring (clip-ից դուրս, որպեսզի եզրը մաքուր լինի) ---
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, MINIMAP_RADIUS - 3, 0, Math.PI * 2);
  ctx.stroke();
}

// ============================================================
// MARKER DOT HELPER
// ============================================================

function drawMarkerDot(ctx, x, y, color, radius) {
  // Արտաքին շող
  ctx.beginPath();
  ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
  ctx.fillStyle = color + '44';
  ctx.fill();

  // Հիմնական կետ
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  // Սահման
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ============================================================
// DIRECTION ARROW (դեպի թիրախ)
// ============================================================

// ⚠️ Սլաքը արդեն գոյություն ունի DOM-ում (<div id="directionArrow">)
const arrowEl = document.getElementById('directionArrow');
let lastArrowTransform = '';
let lastArrowOpacity = '';

function updateDirectionArrow() {
  let target = null;
  if (missionState.phase === 'pickup' && missionState.pickupPoint) {
    target = missionState.pickupPoint;
  } else if (missionState.phase === 'deliver' && missionState.deliverPoint) {
    target = missionState.deliverPoint;
  }

  if (!target) {
    if (lastArrowOpacity !== '0') {
      arrowEl.style.opacity = '0';
      lastArrowOpacity = '0';
    }
    return;
  }

  const dx = target.x - player.position.x;
  const dz = target.z - player.position.z;
  const dist = Math.sqrt(dx * dx + dz * dz);

  // Եթե շատ մոտ ենք, թաքցնում ենք
  if (dist < 6) {
    if (lastArrowOpacity !== '0') {
      arrowEl.style.opacity = '0';
      lastArrowOpacity = '0';
    }
    return;
  }

  // ⚠️ ՈՒՂՂՎԱԾ ԱՆԿՅՈՒՆԸ.
  //
  // heading = 0 → forward = +Z
  // angleToTarget = atan2(dx, dz)
  //   heading = 0 → target +Z-ում → angleToTarget = 0
  //   heading = π/2 → target +X-ում → angleToTarget = π/2
  //
  // relativeAngle = angleToTarget - heading
  //   Սա ցույց է տալիս, թե քանի՞ աստիճանով պետք է պտտվել մեքենան, որ ուղղվի դեպի թիրախը։
  //
  // Էկրանի վրա 0 = վերև, + = ժամացույցի ուղղությամբ։
  // Սլաքը rotate(0) → վերև է։
  //
  // Ուստի. screenAngle = relativeAngle
  const angleToTarget = Math.atan2(dx, dz);
  const relativeAngle = angleToTarget - playerState.heading;
  const screenAngle = relativeAngle;

  const radius = 120;
  const ax = Math.sin(screenAngle) * radius;
  const ay = -Math.cos(screenAngle) * radius;

  const transform = `translate(calc(-50% + ${ax.toFixed(1)}px), calc(-50% + ${ay.toFixed(1)}px)) rotate(${screenAngle.toFixed(3)}rad)`;

  if (transform !== lastArrowTransform) {
    arrowEl.style.transform = transform;
    lastArrowTransform = transform;
  }
  if (lastArrowOpacity !== '0.85') {
    arrowEl.style.opacity = '0.85';
    lastArrowOpacity = '0.85';
  }
}

// ============================================================
// DISTANCE TO TARGET (DOM THROTTLE)
// ============================================================

let lastMissionDistText = '';

function updateMissionDistance() {
  let target = null;
  if (missionState.phase === 'pickup' && missionState.pickupPoint) {
    target = missionState.pickupPoint;
  } else if (missionState.phase === 'deliver' && missionState.deliverPoint) {
    target = missionState.deliverPoint;
  }
  if (!target) return;

  const dx = target.x - player.position.x;
  const dz = target.z - player.position.z;
  const dist = Math.round(Math.sqrt(dx * dx + dz * dz));

  const baseText = missionState.phase === 'pickup'
    ? '📍 Գնա՛ պատվերի կետ'
    : '📦 Հասցրու՛ հաճախորդին';

  const text = `${baseText} — ${dist}մ`;

  // ⚠️ Միայն թարմացնում ենք DOM-ը, երբ տեքստը փոխվում է
  if (text !== lastMissionDistText) {
    missionEl.textContent = text;
    lastMissionDistText = text;
  }
}

// ========== GAME LOOP ==========
let animationId = null;
let minimapAccumulator = 0;
const MINIMAP_INTERVAL = 1 / 30;

function gameLoop() {
  animationId = requestAnimationFrame(gameLoop);

  const dt = Math.min(clock.getDelta(), 0.05);
  const time = performance.now();

  if (gameState.running) {
    updatePhysics(dt);
    checkMissionProgress();
  }

  updateCamera(dt);
  animateMarkers(time);
  updateHUD();
  updateDirectionArrow();
  updateMissionDistance();

  renderer.render(scene, camera);
  if (mapOpen) drawFullscreenMap();

  minimapAccumulator += dt;
  if (minimapAccumulator >= MINIMAP_INTERVAL) {
    minimapAccumulator = 0;
    drawMinimap();
  }

  if (DEBUG) updateFPS();
}

// ========== CAMERA INITIAL PLACEMENT ==========
function placeCameraBehindPlayer() {
  const h = playerState.heading;
  const forwardX = Math.sin(h);
  const forwardZ = Math.cos(h);

  camera.position.set(
    player.position.x - forwardX * CAM_DISTANCE,
    player.position.y + CAM_HEIGHT,
    player.position.z - forwardZ * CAM_DISTANCE
  );
  camLookAt.set(
    player.position.x + forwardX * CAM_LOOK_AHEAD,
    player.position.y + 1.5,
    player.position.z + forwardZ * CAM_LOOK_AHEAD
  );
  camera.lookAt(camLookAt);
  camInitialized = true;
}

// ============================================================
// MOBILE TOUCH CONTROLS

// ========== JOYSTICK ==========
const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');

let joystickActive = false;
let joystickTouchId = null;
let joystickCenterX = 0;
let joystickCenterY = 0;
const JOYSTICK_RADIUS = 60;
const DEAD_ZONE = 0.25;

function getJoystickCenter() {
  if (!joystickBase) return;
  const rect = joystickBase.getBoundingClientRect();
  joystickCenterX = rect.left + rect.width / 2;
  joystickCenterY = rect.top + rect.height / 2;
}

function handleJoystickStart(e) {
  if (joystickActive || !joystickBase) return;
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  joystickActive = true;
  getJoystickCenter();
  handleJoystickMove(e);
}

function handleJoystickMove(e) {
  if (!joystickActive) return;
  let touch = null;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      touch = t;
      break;
    }
  }
  if (!touch) return;

  let dx = touch.clientX - joystickCenterX;
  let dy = touch.clientY - joystickCenterY;

  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > JOYSTICK_RADIUS) {
    dx = (dx / dist) * JOYSTICK_RADIUS;
    dy = (dy / dist) * JOYSTICK_RADIUS;
  }

  if (joystickKnob) {
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  }

  const nx = dx / JOYSTICK_RADIUS;
  const ny = dy / JOYSTICK_RADIUS;

  if (nx < -DEAD_ZONE) {
    keys['KeyA'] = true;
    keys['KeyD'] = false;
  } else if (nx > DEAD_ZONE) {
    keys['KeyD'] = true;
    keys['KeyA'] = false;
  } else {
    keys['KeyA'] = false;
    keys['KeyD'] = false;
  }

  if (ny < -DEAD_ZONE) {
    keys['KeyW'] = true;
    keys['KeyS'] = false;
  } else if (ny > DEAD_ZONE) {
    keys['KeyS'] = true;
    keys['KeyW'] = false;
  } else {
    keys['KeyW'] = false;
    keys['KeyS'] = false;
  }
}

function handleJoystickEnd(e) {
  if (!joystickActive) return;
  let found = false;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      found = true;
      break;
    }
  }
  if (!found) return;

  joystickActive = false;
  joystickTouchId = null;

  if (joystickKnob) {
    joystickKnob.style.transform = 'translate(0px, 0px)';
  }

  keys['KeyA'] = false;
  keys['KeyD'] = false;
  keys['KeyW'] = false;
  keys['KeyS'] = false;
}

if (joystickZone) {
  joystickZone.addEventListener('touchstart', handleJoystickStart, { passive: false });
  joystickZone.addEventListener('touchmove', handleJoystickMove, { passive: false });
  joystickZone.addEventListener('touchend', handleJoystickEnd, { passive: false });
  joystickZone.addEventListener('touchcancel', handleJoystickEnd, { passive: false });
}

// ========== ACTION BUTTONS ==========
function bindTouchButton(btnId, keyCode) {
  const btn = document.getElementById(btnId);
  if (!btn) return;

  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    keys[keyCode] = true;
    btn.classList.add('pressed');
  }, { passive: false });

  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys[keyCode] = false;
    btn.classList.remove('pressed');
  }, { passive: false });

  btn.addEventListener('touchcancel', () => {
    keys[keyCode] = false;
    btn.classList.remove('pressed');
  }, { passive: false });

  btn.addEventListener('mousedown', () => {
    keys[keyCode] = true;
    btn.classList.add('pressed');
  });
  btn.addEventListener('mouseup', () => {
    keys[keyCode] = false;
    btn.classList.remove('pressed');
  });
  btn.addEventListener('mouseleave', () => {
    keys[keyCode] = false;
    btn.classList.remove('pressed');
  });
}

/* ============================================================
   TOUCH CAMERA LOOK
   ============================================================ */

const touchLookZone = document.getElementById('touchLookZone');

let lookTouchId = null;
let lookLastX = 0;
let lookLastY = 0;
const LOOK_SENSITIVITY = 0.005;


function handleLookStart(e) {
  if (!touchLookZone) return;
  if (lookTouchId !== null) return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  lookTouchId = touch.identifier;
  lookLastX = touch.clientX;
  lookLastY = touch.clientY;
}

function handleLookMove(e) {
  if (lookTouchId === null) return;
  e.preventDefault();

  let touch = null;
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      touch = t;
      break;
    }
  }
  if (!touch) return;

  const dx = touch.clientX - lookLastX;
  const dy = touch.clientY - lookLastY;

  lookLastX = touch.clientX;
  lookLastY = touch.clientY;

    // ⚠️ Yaw (360° անսահմանափակ)
  cameraYawOffset -= dx * LOOK_SENSITIVITY;

  // ⚠️ Pitch (վերև/ներքև, -60°-ից +60°)
  cameraPitchOffset += dy * LOOK_SENSITIVITY;
  cameraPitchOffset = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraPitchOffset));
}


function handleLookEnd(e) {
  if (lookTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      lookTouchId = null;
      break;
    }
  }
  // ⚠️ Վերականգնում ենք camera-ն սկզբնական դիրքի
  cameraPitchOffset = 0;
  cameraYawOffset = 0;
}

if (touchLookZone) {
  touchLookZone.addEventListener('touchstart', handleLookStart, { passive: false });
  touchLookZone.addEventListener('touchmove', handleLookMove, { passive: false });
  touchLookZone.addEventListener('touchend', handleLookEnd, { passive: false });
  touchLookZone.addEventListener('touchcancel', handleLookEnd, { passive: false });
}

// ========== DESKTOP — MOUSE LOOK ==========
let mouseLookActive = false;

window.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    mouseLookActive = true;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    e.preventDefault();
  }
});

window.addEventListener('mousemove', (e) => {
  if (!mouseLookActive) return;
  const dx = e.clientX - lookLastX;
  const dy = e.clientY - lookLastY;
  lookLastX = e.clientX;
  lookLastY = e.clientY;

  cameraYawOffset -= dx * LOOK_SENSITIVITY;

  cameraPitchOffset += dy * LOOK_SENSITIVITY;
  cameraPitchOffset = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraPitchOffset));
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 2) {
    mouseLookActive = false;
    cameraPitchOffset = 0;
    cameraYawOffset = 0;
  }
});
window.addEventListener('contextmenu', (e) => {

});

// ========== ԿԱՌՈՒՑԵԼ ՓՈՂՈՑՆԵՐԻ ՑԱՆԿԸ ==========
function buildStreetsList() {
  streetsListEl.innerHTML = '';

  if (typeof STREETS === 'undefined') {
    streetsListEl.innerHTML = '<div style="color:#f55">STREETS չկա</div>';
    return;
  }

  STREETS.forEach((street, index) => {
    const item = document.createElement('div');

    item.innerHTML = `

        <div class="streetName">${index + 1}. ${street.name}</div>
        <div class="streetType">${street.type} • ${street.width}մ</div>

    item.addEventListener('click', () => {

      document.querySelectorAll('.streetItem').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');

      drawFullscreenMap();

// ========== ԳԾԵԼ ՔԱՐՏԵԶԸ ==========
function drawFullscreenMap() {
  if (!mapOpen) return;

  const ctx = fullscreenCtx;
  const W = fullscreenMapCanvas.width;
  const H = fullscreenMapCanvas.height;
  const centerX = W / 2;
  const centerY = H / 2;

  // Թափանցիկ ֆոն
  ctx.clearRect(0, 0, W, H);

  // ՄԵՔԵՆԱՅԻ ՈՒՂՂՈՒԹՅՈՒՆԸ ՄԻՇՏ ՎԵՐԵՎ
   const mapHeading = playerState.heading;

  const px = player.position.x;
  const pz = player.position.z;

  function worldToMap(wx, wz) {
    const dx = wx - px;
    const dz = wz - pz;
    const cos = Math.cos(mapHeading);
    const sin = Math.sin(mapHeading);
    const rx = dx * cos - dz * sin;
    const rz = dx * sin + dz * cos;
    return {
      x: centerX - rx * mapScale,
      y: centerY - rz * mapScale
    };
  }

  // 100մ շառավղով շրջանակ
  const radiusPixels = Math.min(W, H) * 0.45;

  // Կիսաթափանցիկ ֆոն շրջանակի մեջ
  ctx.beginPath();
  ctx.arc(centerX, centerY, radiusPixels, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15, 15, 30, 0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 209, 102, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Clip
  ctx.save();
  ctx.beginPath();
  ctx.arc(centerX, centerY, radiusPixels, 0, Math.PI * 2);
  ctx.clip();

  // ՓՈՂՈՑՆԵՐԸ
  if (typeof STREETS !== 'undefined') {
    STREETS.forEach(street => {
      if (street.points.length < 2) return;

      ctx.strokeStyle = street.type === 'avenue' ? '#4facfe'
        : street.type === 'main' ? '#ffd166'
        : '#888';
      ctx.lineWidth = street.type === 'avenue' ? 5
        : street.type === 'main' ? 3.5
        : 2;
      ctx.lineCap = 'round';

      ctx.beginPath();
      const first = worldToMap(street.points[0].x, street.points[0].z);
      ctx.moveTo(first.x, first.y);

      for (let i = 1; i < street.points.length; i++) {
        const p = worldToMap(street.points[i].x, street.points[i].z);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    });
  }

  // ՇԵՆՔԵՐԸ
  if (typeof buildings !== 'undefined') {
    ctx.fillStyle = 'rgba(138, 122, 90, 0.7)';
    buildings.forEach(b => {
      const p1 = worldToMap(b.minX, b.minZ);
      const p2 = worldToMap(b.maxX, b.maxZ);
      ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
    });
  }

  // LANDMARKS
  if (typeof landmarks !== 'undefined') {
    ctx.fillStyle = 'rgba(255, 209, 102, 0.6)';
    landmarks.forEach(b => {
      const p1 = worldToMap(b.minX, b.minZ);
      const p2 = worldToMap(b.maxX, b.maxZ);
      ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
    });
  }

  // MISSION MARKERS
  if (typeof missionState !== 'undefined') {
    if (missionState.phase === 'pickup' && missionState.pickupPoint) {
      const p = worldToMap(missionState.pickupPoint.x, missionState.pickupPoint.z);
      drawMarkerDot(ctx, p.x, p.y, '#4facfe', 8);
    }
    if (missionState.phase === 'deliver' && missionState.deliverPoint) {
      const p = worldToMap(missionState.deliverPoint.x, missionState.deliverPoint.z);
      drawMarkerDot(ctx, p.x, p.y, '#f5576c', 8);
    }
  }

  ctx.restore();

  // ՄԵՔԵՆԱՅԻ ՍԼԱՔԸ (կենտրոնում, վերև)
  ctx.save();
  ctx.translate(centerX, centerY);

  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(-9, 9);
  ctx.lineTo(0, 5);
  ctx.lineTo(9, 9);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // ՀՈՒՇՈՒՄՆԵՐ
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('🖱️ Scroll՝ zoom | ESC՝ փակել', W / 2, 15);
}

// ========== EVENTS ==========
if (minimapEl) {
  minimapEl.addEventListener('click', openFullscreenMap);
}

if (closeMapBtn) {
  closeMapBtn.addEventListener('click', closeFullscreenMap);
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && mapOpen) {
    closeFullscreenMap();
  }
});

fullscreenMapEl.addEventListener('mousedown', (e) => {
  if (e.target === closeMapBtn) return;
  if (e.target.closest('#streetsLegend') || e.target.closest('#streetInfo')) return;
  isDragging = true;
  fullscreenMapEl.classList.add('dragging');
  dragStartX = e.clientX - mapOffsetX;
  dragStartY = e.clientY - mapOffsetY;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  mapOffsetX = e.clientX - dragStartX;
  mapOffsetY = e.clientY - dragStartY;
  drawFullscreenMap();
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    fullscreenMapEl.classList.remove('dragging');
  }
});

fullscreenMapEl.addEventListener('wheel', (e) => {
  if (e.target.closest('#streetsLegend') || e.target.closest('#streetInfo')) return;
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = mapScale * zoomFactor;
  if (newScale > 0.1 && newScale < 5) {
    mapScale = newScale;
    drawFullscreenMap();
  }
}, { passive: false });

// Touch
let touchStartX = 0, touchStartY = 0, touchDragStartX = 0, touchDragStartY = 0;

fullscreenMapEl.addEventListener('touchstart', (e) => {
  if (e.target.closest('#streetsLegend') || e.target.closest('#streetInfo')) return;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchDragStartX = mapOffsetX;
  touchDragStartY = mapOffsetY;
}, { passive: false });

fullscreenMapEl.addEventListener('touchmove', (e) => {
  if (e.target.closest('#streetsLegend') || e.target.closest('#streetInfo')) return;
  e.preventDefault();
  const touch = e.touches[0];
  mapOffsetX = touchDragStartX + (touch.clientX - touchStartX);
  mapOffsetY = touchDragStartY + (touch.clientY - touchStartY);
  drawFullscreenMap();
}, { passive: false });

window.addEventListener('resize', () => {
  if (mapOpen) {
    fullscreenMapCanvas.width = window.innerWidth;
    fullscreenMapCanvas.height = window.innerHeight;
    drawFullscreenMap();
  }
});
/* ============================================================
   ՎԵՐՋ 🎉
   ============================================================ */
</script>
</body>
</html>
